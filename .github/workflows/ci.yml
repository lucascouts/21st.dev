name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Must satisfy engines.bun (>=1.3.0). Below 1.3, Bun accepts
          # bunfig.toml's install.minimumReleaseAge in silence and applies no
          # cooldown, so a 1.2 runner would install freshly published packages
          # while reporting green.
          bun-version: '1.3'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
