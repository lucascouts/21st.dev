# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required: 
      - TWENTY_FIRST_API_KEY
    properties:
      TWENTY_FIRST_API_KEY:
        type: string
        description: "The API key from https://21st.dev/magic/console"
      LOG_LEVEL:
        type: string
        enum: ["debug", "info", "warn", "error"]
        default: "info"
        description: "Logging verbosity (logs go to stderr)"
  commandFunction:
    # A function that produces the CLI command to start the MCP on stdio.
    # Bun-only: the package requires Bun >= 1.3.0.
    |-
    (config) => ({
      command: 'bun',
      args: ['dist/index.js'],
      env: {
        TWENTY_FIRST_API_KEY: config.TWENTY_FIRST_API_KEY,
        LOG_LEVEL: config.LOG_LEVEL || 'info'
      }
    })
